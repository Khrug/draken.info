<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Portal · Khrug Engineering</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: equipment rack — thin hazard-taped frame, carbon panel, monochrome command bar, 5×3 bays; bay 15 is the archive.
   Every bay has a shareable deep link (#fack-01 … #fack-15) that opens its detail panel with open/download/copy-link.
   Content lives in bays.json and arkiv.json next to this file. Single dark theme by design. */
:root{
  color-scheme:dark;
  --void:#0a0b0c; --panel:#141618; --plate:#1c1f22; --edge:#33383d; --steel:#8a949c;
  --ink:#e6e9eb; --mut:#9aa3aa; --hazard:#f2c230; --hazard-ink:#14120a;
  --display:"Oxanium","Eurostile","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Share Tech Mono",ui-monospace,Consolas,monospace;
  --carbon:
    linear-gradient(27deg,#151719 5px,transparent 5px) 0 5px,
    linear-gradient(207deg,#151719 5px,transparent 5px) 10px 0,
    linear-gradient(27deg,#1b1d20 5px,transparent 5px) 0 10px,
    linear-gradient(207deg,#1b1d20 5px,transparent 5px) 10px 5px,
    linear-gradient(90deg,#17191b 10px,transparent 10px),
    linear-gradient(#1a1c1f 25%,#181a1d 25%,#181a1d 50%,transparent 50%,transparent 75%,#1d1f22 75%,#1d1f22);
  --brushed:linear-gradient(180deg,#25292d,#1b1e21 55%,#202427);
}
*{box-sizing:border-box}
html{background:var(--void)}
body{margin:0;background:var(--void);color:var(--ink);font:15px/1.5 var(--body);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:max(10px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px))}
.frame{max-width:1240px;margin:0 auto;padding:5px;background:repeating-linear-gradient(-45deg,var(--hazard) 0 10px,var(--hazard-ink) 10px 20px);border-radius:4px}
.rack{background:var(--carbon);background-color:#16181a;background-size:20px 20px;border-radius:2px;box-shadow:inset 0 0 0 1px #000,inset 0 0 40px rgba(0,0,0,.6);padding:clamp(14px,3vw,28px)}
header.top{display:flex;align-items:center;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--edge)}
.logo{height:clamp(44px,8vw,64px);width:auto;display:block;border-radius:2px;mix-blend-mode:screen;filter:grayscale(1) contrast(1.05)}
h1{font:800 clamp(22px,5vw,38px)/1 var(--display);letter-spacing:.08em;margin:0;text-transform:uppercase}
.sect{font:12px/1 var(--mono);color:var(--mut);letter-spacing:.2em;text-transform:uppercase;margin-top:7px}
nav.cmd{display:flex;flex-wrap:wrap;gap:6px;padding-block:14px}
nav.cmd button,nav.cmd a{font:600 12.5px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);background:var(--brushed);border:1px solid var(--edge);border-radius:2px;padding:11px 14px;cursor:pointer;text-decoration:none}
nav.cmd button:hover,nav.cmd a:hover{border-color:var(--steel)}
nav.cmd .ext{margin-left:auto;color:var(--mut)}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.status{font:12px var(--mono);color:var(--mut);min-height:1.5em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:6px}
.bay{position:relative;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--edge);border-radius:3px;overflow:hidden;min-width:0;color:inherit;text-decoration:none}
a.bay:hover{border-color:var(--steel)}
.bay .no{position:absolute;top:8px;left:8px;z-index:2;font:12px/1 var(--mono);color:var(--ink);background:rgba(10,11,12,.85);border:1px solid var(--edge);padding:3px 5px;border-radius:2px}
.thumb{aspect-ratio:4/3;max-width:100%;background:#0d0f10;display:grid;place-items:center;overflow:hidden;border-bottom:1px solid var(--edge)}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top}
.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px;text-align:center;width:100%;height:100%}
.ph .big{font:700 30px/1 var(--display);letter-spacing:.06em;color:var(--steel)}
.ph .small{font:12px var(--mono);color:var(--mut);word-break:break-all}
.empty .ph .big{font-size:38px;color:var(--edge)}
.cap{padding:10px 10px 12px}
.cap .title{font:600 14px/1.3 var(--body);overflow-wrap:anywhere}
.cap .meta{font:11.5px var(--mono);color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-top:3px}
.locker .thumb{background:var(--brushed)}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--edge);border-radius:3px;padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(0,0,0,.75)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:12px}
.dlg .no{font:12px var(--mono);color:var(--mut);letter-spacing:.15em}
.dlg h2{font:700 20px/1.2 var(--display);letter-spacing:.05em;text-transform:uppercase;margin:0;overflow-wrap:anywhere}
.dlg .meta{font:12px var(--mono);color:var(--mut);text-transform:uppercase}
.dlg .prev{max-height:48vh;overflow:hidden;border:1px solid var(--edge);border-radius:2px;background:#0d0f10}
.dlg .prev img{display:block;width:100%;height:auto}
.row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:600 12.5px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;padding:12px 14px;border-radius:2px;border:1px solid var(--edge);background:var(--brushed);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--steel)}
.btn.pri{border-color:var(--steel)}
.btn.end{margin-left:auto;color:var(--mut)}
.alist{display:flex;flex-direction:column;border-top:1px solid var(--edge)}
.aitem{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--edge)}
.aitem a{color:var(--ink);font-weight:500;overflow-wrap:anywhere;flex:1;min-width:0}
.aitem .cat{font:11px var(--mono);color:var(--mut);text-transform:uppercase;flex:0 0 7.5em}
.aitem .d{font:11px var(--mono);color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:12px var(--mono);padding:5px 8px;border:1px solid var(--edge);border-radius:2px;background:none;color:var(--mut);cursor:pointer;text-transform:uppercase}
.chip[aria-pressed="true"]{border-color:var(--steel);color:var(--ink)}
footer{margin-top:20px;padding-top:12px;border-top:1px solid var(--edge);font:12px var(--mono);color:var(--mut);display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}
@media (max-width:460px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.ph .big{font-size:22px}.cap .title{font-size:13px}nav.cmd .ext{margin-left:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="frame"><div class="rack">
  <header class="top">
    <img class="logo" src="/khrug/logo.jpg" alt="" width="439" height="223">
    <div><h1>Khrug Engineering</h1><div class="sect">Portal</div></div>
  </header>

  <nav class="cmd" aria-label="Huvudmeny" id="cmd">
    <button id="archBtn">Arkiv</button>
    <a class="ext" href="https://draken.info/">Draken ↗</a>
  </nav>
  <div class="status" id="status" aria-live="polite">Laddar…</div>
  <div class="grid" id="grid"></div>
  <footer><span>Khrug Engineering</span><span id="upd"></span></footer>
</div></div>

<div hidden><i id="fack-01"></i><i id="fack-02"></i><i id="fack-03"></i><i id="fack-04"></i><i id="fack-05"></i><i id="fack-06"></i><i id="fack-07"></i><i id="fack-08"></i><i id="fack-09"></i><i id="fack-10"></i><i id="fack-11"></i><i id="fack-12"></i><i id="fack-13"></i><i id="fack-14"></i><i id="fack-15"></i></div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

<script>
(function(){
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var host=function(u){try{return new URL(u,location.href).hostname.replace(/^www\./,'')}catch(e){return u}};
var dlg=$('#dlg'),body=$('#dlgBody'),archive=[],aFilter='',BAYS=[];
var CATS=['Ansökningsbrev','Annons','Länk','Intyg','Övrigt'];
var pad=function(i){return ('0'+i).slice(-2)};
var isExt=function(u){return /^https?:/.test(u)&&host(u)!==location.hostname};
var isFile=function(b){return b.kind==='file'&&/\.(pdf|docx?|xlsx?|pptx?|png|jpe?g|webp|zip|txt|md)$/i.test(b.url||'')};
var fname=function(u){return decodeURIComponent((u||'').split('/').pop()||'fil')};
var link=function(n){return location.origin+location.pathname+'#fack-'+pad(n)};

function thumb(b){
  if(b.thumb) return '<img src="'+esc(b.thumb)+'" alt="" loading="lazy">';
  if(b.kind==='file'&&/\.(png|jpe?g|webp|gif)$/i.test(b.url||'')) return '<img src="'+esc(b.url)+'" alt="" loading="lazy">';
  if(b.kind==='link') return '<div class="ph"><div class="big">'+esc(b.type||'WEB')+'</div><div class="small">'+esc(host(b.url))+'</div></div>';
  return '<div class="ph"><div class="big">'+esc(b.type||'FIL')+'</div></div>';
}
function metaOf(b){return (b.kind==='link'?'Webbsida':(b.type||'Fil'))+(b.date?' · '+b.date:'')}
function render(){
  var g=$('#grid'),html='';
  for(var i=0;i<14;i++){
    var b=BAYS[i]||{},n=pad(i+1);
    if(!b.kind){html+='<div class="bay empty"><span class="no">'+n+'</span><div class="thumb"><div class="ph"><div class="big">—</div><div class="small">ledigt fack</div></div></div><div class="cap"><div class="title">Ledigt</div><div class="meta">&nbsp;</div></div></div>';continue}
    html+='<a class="bay" href="'+'#'+'fack-'+n+'"><span class="no">'+n+'</span><div class="thumb">'+thumb(b)+'</div><div class="cap"><div class="title">'+esc(b.title)+'</div><div class="meta">'+esc(metaOf(b))+'</div></div></a>';
  }
  html+='<a class="bay locker" href="#fack-15"><span class="no">15</span><div class="thumb"><div class="ph"><div class="big">ARKIV</div><div class="small">'+archive.length+' poster</div></div></div><div class="cap"><div class="title">Arkiv</div><div class="meta">Mapp</div></div></a>';
  g.innerHTML=html;
  var cmd=$('#cmd'),first=cmd.firstChild;
  BAYS.forEach(function(b){if(b&&b.kind&&b.menu){var a=document.createElement('a');a.href=b.url;a.textContent=b.menu;if(isExt(b.url)){a.target='_blank';a.rel='noopener'}cmd.insertBefore(a,first)}});
}
function copyBtn(id,text){var el=$(id);el.onclick=function(){(navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(function(){el.textContent='Länk kopierad'},function(){prompt('Kopiera länken:',text)})}}
function show(html){body.innerHTML=html;if(!dlg.open)dlg.showModal()}
function openBay(n){
  if(n===15)return openArchive();
  var b=BAYS[n-1];if(!b||!b.kind)return;
  var ext=isExt(b.url),tgt=ext||isFile(b)?' target="_blank" rel="noopener"':'';
  show('<div class="no">FACK '+pad(n)+'</div><h2>'+esc(b.title)+'</h2><div class="meta">'+esc(metaOf(b))+'</div>'+
    (b.thumb?'<a class="prev" href="'+esc(b.url)+'"'+tgt+'><img src="'+esc(b.thumb)+'" alt=""></a>':'')+
    '<div class="row2"><a class="btn pri" href="'+esc(b.url)+'"'+tgt+'>Öppna</a>'+
    (isFile(b)&&!ext?'<a class="btn" href="'+esc(b.url)+'" download="'+esc(fname(b.url))+'">Ladda ner</a>':'')+
    '<button class="btn" id="cpL">Kopiera länk</button><button class="btn end" id="xClose">Stäng</button></div>');
  copyBtn('#cpL',link(n));$('#xClose').onclick=close;
}
function openArchive(){
  var list=archive.filter(function(a){return !aFilter||a.cat===aFilter});
  show('<div class="no">FACK 15</div><h2>Arkiv</h2><div class="chips" id="aChips">'+[''].concat(CATS).map(function(c){return '<button class="chip" aria-pressed="'+(aFilter===c)+'" data-c="'+c+'">'+(c||'Alla')+'</button>'}).join('')+'</div>'+
   '<div class="alist">'+(list.length?list.map(function(a){var f=/\.(pdf|docx?)$/i.test(a.url||'')&&!isExt(a.url);return '<div class="aitem"><span class="cat">'+esc(a.cat)+'</span><a href="'+esc(a.url)+'" target="_blank" rel="noopener">'+esc(a.title)+'</a>'+(f?'<a href="'+esc(a.url)+'" download style="flex:0 0 auto;color:var(--mut);font:11px var(--mono)">LADDA NER</a>':'')+'<span class="d">'+esc(a.date||'')+'</span></div>'}).join(''):'<div class="aitem" style="color:var(--mut)">Inget arkiverat här ännu.</div>')+'</div>'+
   '<div class="row2"><button class="btn" id="cpL">Kopiera länk</button><button class="btn end" id="aClose">Stäng</button></div>');
  $('#aChips').onclick=function(e){var b=e.target.closest('.chip');if(b){aFilter=b.dataset.c;openArchive()}};
  copyBtn('#cpL',link(15));$('#aClose').onclick=close;
}
function close(){dlg.close()}
dlg.addEventListener('close',function(){if(/^#fack-/.test(location.hash))history.replaceState(null,'',location.pathname)});
dlg.addEventListener('click',function(e){if(e.target===dlg)close()});
function route(){var m=/^#fack-(\d{1,2})$/.exec(location.hash);if(m){var n=+m[1];if(n>=1&&n<=15)openBay(n)}}
window.addEventListener('hashchange',route);
$('#archBtn').onclick=function(){location.hash='fack-15'};

Promise.all([
  fetch('/khrug/bays.json',{cache:'no-cache'}).then(function(r){return r.json()}),
  fetch('/khrug/arkiv.json',{cache:'no-cache'}).then(function(r){return r.json()}).catch(function(){return {items:[]}})
]).then(function(r){
  archive=(r[1].items||[]).slice().sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''))});
  BAYS=r[0].bays||[];render();
  $('#status').textContent='';
  if(r[0].updated)$('#upd').textContent='Uppdaterad '+r[0].updated;
  route();
}).catch(function(){$('#status').textContent='Kunde inte läsa innehållet. Ladda om sidan.';render()});
})();
</script>
</body>
</html>
