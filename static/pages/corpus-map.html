<!-- Corpus Map page body. Data: /data/corpus-map.json, generated by scripts/corpus-map.js on every build. Script: /map/app.js (source static/map/app.js). -->
<style>
#cmap{
  --cm-ground:var(--bg,#080c08); --cm-paper:var(--bg-card,#0f170f); --cm-ink:var(--text-bright,#e4f0e4); --cm-text:var(--text,#c8d8c8);
  --cm-muted:var(--text-dim,#6b8a6b); --cm-line:var(--border-hover,#264026); --cm-cite:var(--gold,#c9a84c); --cm-focus:var(--blue,#60a5fa);
  --cm-theme:#5fb3b3; --cm-domain:var(--gold,#c9a84c);
  --ground:var(--cm-ground); --op:var(--cm-ink); --theme:var(--cm-theme); --domain:var(--cm-domain);
  --c0:#e07a5f; --c1:#60a5fa; --c2:#4ade80; --c3:#b794f4; --c4:#c9a84c; --c5:#5fb3b3; --c6:#d8a1c4; --c7:#a3b86c;
  position:relative; height:calc(100vh - 82px); height:calc(100dvh - 82px); min-height:420px;
  display:grid; grid-template-rows:auto 1fr; background:var(--cm-ground); color:var(--cm-text); font-family:var(--serif,Georgia,serif);
}
#cmap .cm-bar{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .8rem;padding:.55rem .9rem;border-bottom:1px solid var(--border,#1a2c1a);background:var(--bg-surface,#0b120b)}
#cmap .cm-title{font-family:var(--sans,system-ui);font-weight:600;font-size:1rem;color:var(--cm-ink);white-space:nowrap}
#cmap .cm-stats{font-family:var(--mono,monospace);font-size:.72rem;color:var(--cm-muted)}
#cmap .cm-search{flex:1 1 12rem;min-width:9rem;position:relative}
#cmap .cm-search input{width:100%;font-family:var(--mono,monospace);font-size:.8rem;padding:.4rem .6rem;border:1px solid var(--cm-line);background:var(--cm-ground);color:var(--cm-ink);border-radius:4px}
#cmap .cm-results{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--cm-paper);border:1px solid var(--cm-line);max-height:50vh;overflow:auto;display:none}
#cmap .cm-results button{display:block;width:100%;text-align:left;font-family:var(--mono,monospace);font-size:.78rem;padding:.45rem .6rem;border:0;background:none;color:var(--cm-ink);cursor:pointer}
#cmap .cm-results button:hover,#cmap .cm-results button:focus-visible{background:var(--bg-card-hover,#142014)}
#cmap .cm-btn{font-family:var(--mono,monospace);font-size:.75rem;padding:.35rem .7rem;border:1px solid var(--cm-line);border-radius:4px;background:transparent;color:var(--cm-text);cursor:pointer;text-decoration:none;display:inline-block}
#cmap .cm-btn:hover{border-color:var(--cm-focus);color:var(--cm-ink)}
#cmap .cm-btn[aria-pressed="true"]{border-color:var(--cm-focus);color:var(--cm-focus);background:rgba(96,165,250,.1)}
#cmap button:focus-visible,#cmap input:focus-visible,#cmap a:focus-visible{outline:2px solid var(--cm-focus);outline-offset:2px}
#cmap .cm-stage{position:relative;overflow:hidden}
#cmap svg{display:block;width:100%;height:100%;touch-action:none}
#cmap .edge{stroke:var(--cm-line);fill:none}
#cmap .edge.cite{stroke:var(--cm-cite)}
#cmap .cedge{stroke:var(--cm-muted);stroke-dasharray:2 3}
#cmap .node{cursor:pointer}
#cmap .node text{opacity:0;transition:opacity .15s;font-family:var(--mono,monospace);font-size:9px;fill:var(--cm-ink);paint-order:stroke;stroke:var(--cm-ground);stroke-width:3px;pointer-events:none}
#cmap .dim{opacity:.1}
#cmap .lab .node text,#cmap .node.hi text,#cmap .node.concept text{opacity:1}
#cmap .node.dim text{opacity:0}
#cmap .stream .node.concept text{opacity:0}
#cmap .stream.lab .node.concept text,#cmap .stream .node.concept.hi text{opacity:1}
#cmap .stream .edge.cite{stroke-opacity:.18}
#cmap .trail{stroke:var(--cm-focus);stroke-width:2.5;fill:none}
#cmap .axis text,#cmap .lane{font-family:var(--mono,monospace);font-size:9px;fill:var(--cm-muted)}
#cmap .axis line,#cmap .axis path{stroke:var(--cm-line)}
#cmap .cm-hint{position:absolute;left:.8rem;top:.6rem;font-family:var(--mono,monospace);font-size:.72rem;color:var(--cm-muted);max-width:30rem;pointer-events:none}
#cmap .cm-clusters{position:absolute;left:0;right:0;bottom:0;display:flex;gap:.35rem;overflow-x:auto;padding:.5rem .7rem}
#cmap .chip{flex:0 0 auto;font-family:var(--mono,monospace);font-size:.7rem;padding:.25rem .55rem;border:1px solid var(--cm-line);border-radius:999px;background:var(--cm-paper);color:var(--cm-text);cursor:pointer;display:inline-flex;align-items:center;gap:.35rem}
#cmap .chip i{width:.55rem;height:.55rem;border-radius:2px;display:inline-block}
#cmap .chip[aria-pressed="true"]{border-color:var(--cm-ink)}
#cmap .cm-panel{position:absolute;top:0;right:0;width:min(390px,100%);height:100%;background:var(--cm-paper);border-left:1px solid var(--cm-line);overflow:auto;padding:1rem 1.1rem 4rem;transform:translateX(105%);transition:transform .22s ease}
#cmap .cm-panel.open{transform:none}
@media (max-width:700px){
  #cmap .cm-panel{top:auto;bottom:0;width:100%;height:62%;border-left:0;border-top:1px solid var(--cm-line);transform:translateY(105%)}
  #cmap .cm-panel.open{transform:none}
  #cmap .cm-search{flex:1 0 100%;order:5}
}
@media (prefers-reduced-motion:reduce){#cmap .cm-panel{transition:none}}
#cmap .cm-panel h2{font-family:var(--sans,system-ui);font-size:1.15rem;line-height:1.3;margin:.2rem 0 .5rem;font-weight:600;color:var(--cm-ink)}
#cmap .meta{font-family:var(--mono,monospace);font-size:.72rem;color:var(--cm-muted);line-height:1.6}
#cmap .cm-panel p{line-height:1.55;font-size:1.02rem;margin:.6rem 0}
#cmap .cm-panel h3{font-family:var(--mono,monospace);font-size:.72rem;font-weight:700;margin:1rem 0 .35rem;color:var(--cm-muted)}
#cmap .tags{display:flex;flex-wrap:wrap;gap:.3rem}
#cmap .tag{font-family:var(--mono,monospace);font-size:.68rem;padding:.15rem .45rem;border:1px solid var(--cm-line);border-radius:3px;background:var(--cm-ground);color:var(--cm-text);cursor:pointer}
#cmap .tag.static{cursor:default}
#cmap .list,#cmap .steps{list-style:none;padding:0;margin:0}
#cmap .list li{margin:.2rem 0}
#cmap .list button,#cmap .steps button{font:inherit;font-size:.98rem;text-align:left;border:0;background:none;color:var(--cm-ink);padding:.15rem 0;cursor:pointer;text-decoration:underline;text-decoration-color:var(--cm-line);text-underline-offset:3px}
#cmap .why{display:block;font-family:var(--mono,monospace);font-size:.68rem;color:var(--cm-muted)}
#cmap .cm-close{position:absolute;top:.6rem;right:.7rem}
#cmap .actions{display:flex;flex-wrap:wrap;gap:.4rem;margin:.8rem 0}
#cmap .steps{counter-reset:s}
#cmap .steps li{counter-increment:s;position:relative;padding-left:1.7rem;margin:.35rem 0}
#cmap .steps li::before{content:counter(s);position:absolute;left:0;top:.15rem;font-family:var(--mono,monospace);font-size:.7rem;color:var(--cm-muted)}
#cmap .cm-load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono,monospace);font-size:.8rem;color:var(--cm-muted)}
</style>
<section id="cmap" aria-label="Corpus Map">
  <div class="cm-bar">
    <span class="cm-title">Corpus Map</span><span class="cm-stats" id="cm-stats"></span>
    <div class="cm-search"><input id="cm-q" type="search" placeholder="Search a post, concept or DRK number" autocomplete="off" aria-label="Search the corpus"><div class="cm-results" id="cm-res" role="listbox"></div></div>
    <button class="cm-btn" id="cm-mMap" aria-pressed="true">Map</button>
    <button class="cm-btn" id="cm-mStream" aria-pressed="false">Stream</button>
    <button class="cm-btn" id="cm-bConcepts" aria-pressed="true">Concepts</button>
    <button class="cm-btn" id="cm-bAbout">Method</button>
  </div>
  <div class="cm-stage">
    <svg id="cm-svg" aria-label="Graph of the Draken corpus"></svg>
    <div class="cm-load" id="cm-load">Loading the corpus…</div>
    <div class="cm-hint" id="cm-hint"></div>
    <div class="cm-clusters" id="cm-clusters"></div>
    <aside class="cm-panel" id="cm-panel" aria-live="polite"><button class="cm-btn cm-close" id="cm-close" aria-label="Close panel">Close</button><div id="cm-pbody"></div></aside>
  </div>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="/map/app.js"></script>
